# Render Blueprint — WA Business SaaS (whatsapp-saas/)
# Render Dashboard → New → Blueprint → এই রিপো বাছাই করুন।
# Persistent disk এর জন্য পেইড প্ল্যান (Starter) লাগে; ফ্রি প্ল্যানে রিস্টার্টে সব ডাটা মুছে যায়।
services:
  - type: web
    name: wa-business-saas
    runtime: docker
    dockerfilePath: ./whatsapp-saas/Dockerfile
    dockerContext: ./whatsapp-saas
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: wa-desk-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: META_APP_SECRET
        sync: false
      - key: ALLOW_SIGNUP
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: GRAPH_API_VERSION
        value: v21.0
